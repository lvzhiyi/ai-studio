# ai-dev-workflow 项目配置（放在项目根目录，提交进 git）
# 推荐运行 /workflow-core:init 自动探测并生成；也可以手动复制后按实际填写。
#
# 格式：YAML 受限子集，由插件自带解析器读取（不依赖 PyYAML）
#   - “键: 值”映射；值为空时，下一行缩进 2 格写子项
#   - 字符串列表逐行写 “- 值”，不支持行内 [a, b] 和 {a: b}
#   - 不支持多行字符串（| >）、锚点（& *）、多文档（---）、制表符缩进
#   - 未确认的值写“待确认”，不适用写“无”，不要留示例值
# 只放脚本和技能能直接取用的事实（路径、命令、枚举、名称）；规则和说明写在项目 docs/。
# 写完运行：python3 <workflow-core>/scripts/check_docs.py --root . --check-config

version: 1

docs:
  product_root: docs/product
  home: docs/product/项目首页.md
  requirements: docs/product/需求/需求说明.md
  cards_dir: docs/product/任务
  overview: docs/product/任务/版本任务总览.md
  design_index: 无
  dev_docs: docs/development
  glossary: docs/product/术语表.md

spec:
  tool: none
  dir: 无

handoff:
  with_change: 无
  default: docs/development/handoffs/{task_id}.md

review:
  base_branch: develop

verify:
  docs: python3 <workflow-core>/scripts/check_docs.py --root . --check-config
  light:
    - cd engine && uv run python -m unittest discover -s tests
    - cd web && npm run typecheck && npm run build
    - cd server && npm run typecheck && npm test
  standard:
    - cd engine && uv run python -m unittest discover -s tests
    - cd web && npm run typecheck && npm run build
    - cd server && npm run typecheck && npm test
  full:
    - cd engine && uv run python -m unittest discover -s tests
    - cd web && npm run typecheck && npm run build
    - cd server && npm run typecheck && npm run test:cov

platforms:
  default:
    - web
  on_request:
    - 无
  excluded:
    - android
    - ios

design:
  tool: 无
  source_doc: 无

api:
  tool: 无
  project: 无
  project_id_file: 无

code_rules_doc: docs/development/coding.md

notes:
  - 轻量档只跑改动所在子项目的那一条 light 命令（engine / web / server 各一条）
  - engine 依赖 Apple Silicon 上的 MLX，不进 CI，只在本机验证
  - 已有的设计与计划文档在 docs/superpowers/specs 和 docs/superpowers/plans
  - 架构说明沿用 docs/architecture.md，路线图沿用 docs/roadmap.md
